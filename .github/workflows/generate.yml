name: 1. Write a new draft

# Times are UTC. 02:15 UTC = 7:45 am IST, every day. GitHub sometimes starts
# timers 5 to 15 minutes late, so the draft reaches Telegram around 8 am.
# To skip a day of the week, replace the last "*" with e.g. "1-6" (Mon to Sat).
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave empty to use the next one in content/topics.txt)"
        required: false

concurrency:
  group: misfit-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write, render and send to Telegram
        run: python -m src.main generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
      - name: Save drafts and state back to the repository
        if: always()
        run: |
          git config user.name "misfit-bot"
          git config user.email "misfit-bot@users.noreply.github.com"
          git add -A posts state content
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "bot: update drafts and state"
          git pull --rebase --autostash
          git push
