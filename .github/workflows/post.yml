name: 4. Post at the scheduled slots

# Posting slots (IST): 7:30 pm and 3:30 am, with back-ups at 8:30 pm and 4:30 am.
# GitHub often starts timers late, so each run starts about 33 minutes early
# (13:27, 14:27, 21:27 and 22:27 UTC), waits for the exact time, then posts
# whatever is approved and due. If you change "slots" in config.json, change
# these times too (about 30 minutes before each slot and back-up, in UTC).
on:
  schedule:
    - cron: "27 13,14,21,22 * * *"
  workflow_dispatch:

concurrency:
  group: misfit-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for the post time and publish
        run: python -m src.main post-due
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save drafts and state back to the repository
        if: always()
        run: |
          git config user.name "misfit-bot"
          git config user.email "misfit-bot@users.noreply.github.com"
          git add -A posts state content
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "bot: update drafts and state"
          git pull --rebase --autostash
          git push
