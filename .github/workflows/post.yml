name: 4. Post at the scheduled slots

# Posting slot (IST): 6 pm every day, with a back-up at 7 pm.
# GitHub often starts timers late, so each run starts about 33 minutes early
# (11:57 and 12:57 UTC, which is 5:27 pm and 6:27 pm IST). The first job only waits for the exact
# time (so the app's buttons keep working meanwhile); the second job posts
# whatever is approved and due. If you change "slots" in config.json, change
# these times too (about 30 minutes before each slot and back-up, in UTC).
on:
  schedule:
    - cron: "57 11,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the post time
        run: python3 src/wait_slot.py

  post:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: misfit-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish what's due
        run: python -m src.main post-due
        env:
          NO_WAIT: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save drafts and state back to the repository
        if: always()
        run: |
          git config user.name "misfit-bot"
          git config user.email "misfit-bot@users.noreply.github.com"
          git add -A posts state content
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "bot: update drafts and state"
          git pull --rebase --autostash
          git push
