name: 4. Post at the scheduled slots

# Runs every hour at about 17 minutes past the hour IST (GitHub often starts
# timers late). The first job checks the posting times (set in the app, or in
# config.json) and, if a slot or back-up is coming up within 45 minutes, waits
# for it; otherwise it stops and the posting job is skipped. The second job
# posts whatever is approved and due. Because it runs hourly, changing the
# times in the app needs no change here.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the post time
        id: slot
        run: python3 src/wait_slot.py

  post:
    needs: wait
    if: needs.wait.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: misfit-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish what's due
        run: python -m src.main post-due
        env:
          NO_WAIT: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save drafts and state back to the repository
        if: always()
        run: |
          git config user.name "misfit-bot"
          git config user.email "misfit-bot@users.noreply.github.com"
          git add -A posts state content
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "bot: update drafts and state"
          git pull --rebase --autostash
          git push
