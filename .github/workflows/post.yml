name: 4. Post at 5 pm IST

# Starts at 4:48 pm IST (11:18 UTC), waits until exactly 5:00 pm IST, then
# publishes the approved draft. If you change post_time_ist in config.json,
# change this time too (it must be 5 to 20 minutes before the post time, in UTC).
on:
  schedule:
    - cron: "18 11 * * *"
  workflow_dispatch:

concurrency:
  group: misfit-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for the post time and publish
        run: python -m src.main post-due
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save drafts and state back to the repository
        if: always()
        run: |
          git config user.name "misfit-bot"
          git config user.email "misfit-bot@users.noreply.github.com"
          git add -A posts state content
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "bot: update drafts and state"
          git pull --rebase --autostash
          git push
